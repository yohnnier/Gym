<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f1115">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Rutinas</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon.svg">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="top">
    <h1>Rutinas</h1>
    <span class="muted small" id="sub">Hipertrofia · 0–2 en reserva</span>
  </header>

  <main id="app"></main>

  <div id="timer" class="timer hidden" role="timer" aria-live="polite">
    <div class="timer-fill" id="t-bar"></div>
    <div class="timer-row">
      <span class="timer-label">Descanso</span>
      <strong id="t-time">0:00</strong>
      <span class="timer-actions">
        <button class="btn small" id="t-plus" type="button">+15 s</button>
        <button class="btn small" id="t-skip" type="button">Saltar</button>
      </span>
    </div>
  </div>

  <nav class="tabs" aria-label="Secciones">
    <button type="button" data-view="hoy">Hoy</button>
    <button type="button" data-view="hist">Historial</button>
    <button type="button" data-view="rutina">Rutina</button>
  </nav>

  <script src="js/routine.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
