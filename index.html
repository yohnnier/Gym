<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0c0f14" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f4f6f9" media="(prefers-color-scheme: light)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Rutinas</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon.svg">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="top">
    <div class="top-inner">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 7v10M18 7v10M3 10v4M21 10v4M6 12h12"/></svg>
        </span>
        <div>
          <h1>Rutinas</h1>
          <div class="sub" id="sub"></div>
        </div>
      </div>
    </div>
  </header>

  <main id="app"></main>

  <div id="timer" class="timer hidden" role="timer" aria-live="polite">
    <div class="timer-fill" id="t-bar"></div>
    <div class="timer-row">
      <span class="timer-label">Descanso</span>
      <strong id="t-time">0:00</strong>
      <span class="timer-actions">
        <button class="btn small" id="t-plus" type="button">+15 s</button>
        <button class="btn small" id="t-skip" type="button">Saltar</button>
      </span>
    </div>
  </div>

  <div id="sheet" class="sheet hidden"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <nav class="tabs" aria-label="Secciones">
    <button type="button" data-view="hoy"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Inicio</button>
    <button type="button" data-view="prog"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/></svg>Progreso</button>
    <button type="button" data-view="hist"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/></svg>Historial</button>
    <button type="button" data-view="rutina"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>Rutinas</button>
  </nav>

  <script src="js/routine.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
